# Config de análisis para pysonar (ver Makefile: make sonar / sonar-check).
# SONAR_HOST_URL y SONAR_TOKEN van por variables de entorno (.env), nunca aquí.
sonar.projectKey=capataz-api
sonar.projectName=capataz-api
sonar.sources=src
sonar.tests=tests
sonar.python.version=3.14
sonar.python.coverage.reportPaths=coverage.xml
sonar.sourceEncoding=UTF-8

# Evita que el escáner analice bytecode/artefactos binarios como si fueran código fuente.
sonar.exclusions=**/__pycache__/**,**/*.pyc,**/.venv/**,**/.pytest_cache/**,**/.mypy_cache/**,**/.ruff_cache/**,**/htmlcov/**
