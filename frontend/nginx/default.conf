server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  location /api/ { proxy_pass http://api:8000; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Request-ID $request_id; proxy_set_header X-Real-IP $remote_addr; proxy_set_header Connection ''; proxy_buffering off; }
  # Rendered at container start (see frontend/nginx/40-render-runtime-config.sh) into a small
  # writable tmpfs, separate from the read-only static bundle below it — see
  # docs/adr/007-runtime-frontend-config.en.md. no-store: this must never be cached, unlike the
  # hashed JS/CSS assets under /assets/, or a redeployed config change would go unnoticed.
  location = /config.js { alias /config-runtime/config.js; add_header Cache-Control "no-store" always; }
  location / { try_files $uri $uri/ /index.html; }
}
