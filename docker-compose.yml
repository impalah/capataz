name: capataz

x-api-env: &api-env
  CAPATAZ_ENV: ${CAPATAZ_ENV:-production}
  CAPATAZ_LOG_LEVEL: ${CAPATAZ_LOG_LEVEL:-INFO}
  CAPATAZ_LOG_JSON: ${CAPATAZ_LOG_JSON:-true}
  CAPATAZ_API_HOST: ${CAPATAZ_API_HOST:-0.0.0.0}
  CAPATAZ_API_PORT: ${CAPATAZ_API_PORT:-8000}
  CAPATAZ_CORS_ORIGINS: ${CAPATAZ_CORS_ORIGINS:-http://localhost:8080}
  CAPATAZ_CELERY_QUEUE: ${CAPATAZ_CELERY_QUEUE:-automation}
  CAPATAZ_CELERY_CONCURRENCY: ${CAPATAZ_CELERY_CONCURRENCY:-2}
  CAPATAZ_PORTAINER_URL: ${CAPATAZ_PORTAINER_URL:-https://portainer.home.arpa}
  CAPATAZ_GRAFANA_URL: ${CAPATAZ_GRAFANA_URL:-https://grafana.home.arpa}
  CAPATAZ_LOKI_URL: ${CAPATAZ_LOKI_URL:-https://loki.home.arpa}
  CAPATAZ_PROMETHEUS_URL: ${CAPATAZ_PROMETHEUS_URL:-https://prometheus.home.arpa}
  CAPATAZ_COGNITO_REGION: ${CAPATAZ_COGNITO_REGION:-eu-west-1}
  CAPATAZ_COGNITO_USER_POOL_ID: ${CAPATAZ_COGNITO_USER_POOL_ID:-}
  CAPATAZ_COGNITO_APP_CLIENT_ID: ${CAPATAZ_COGNITO_APP_CLIENT_ID:-}
  CAPATAZ_OIDC_ISSUER: ${CAPATAZ_OIDC_ISSUER:-}
  CAPATAZ_OIDC_AUDIENCE: ${CAPATAZ_OIDC_AUDIENCE:-}
  CAPATAZ_OIDC_JWKS_URI: ${CAPATAZ_OIDC_JWKS_URI:-}
  CAPATAZ_OIDC_GROUPS_CLAIM: ${CAPATAZ_OIDC_GROUPS_CLAIM:-groups}
  CAPATAZ_AUTH_MODE: ${CAPATAZ_AUTH_MODE:-cognito}
  CAPATAZ_INITIAL_CATALOG_YAML_PATH: ${CAPATAZ_INITIAL_CATALOG_YAML_PATH:-/app/catalog/services.example.yaml}
  CAPATAZ_HTTP_TIMEOUT_SECONDS: ${CAPATAZ_HTTP_TIMEOUT_SECONDS:-5}
  CAPATAZ_HEALTH_ALLOWED_HOST_SUFFIXES: ${CAPATAZ_HEALTH_ALLOWED_HOST_SUFFIXES:-.home.arpa}
  CAPATAZ_STATUS_CACHE_TTL_SECONDS: ${CAPATAZ_STATUS_CACHE_TTL_SECONDS:-30}
  # Vacío por defecto: httpx usa el bundle de CAs públicas (certifi) de siempre. Solo
  # rellénalo (a /run/ca-certs/ca-bundle.pem) si confías en una CA interna del homelab —
  # ver `make trust-ca` y docs/09-authentik-oidc-setup.en.md.
  SSL_CERT_FILE: ${SSL_CERT_FILE:-}

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: capataz-frontend:local
    # Runtime config (not a build arg): rendered into /config-runtime/config.js at container
    # start by frontend/nginx/40-render-runtime-config.sh — see
    # docs/adr/007-runtime-frontend-config.en.md. Changing these and recreating the container is
    # enough; no rebuild needed, unlike the old VITE_*-build-arg approach.
    environment:
      CAPATAZ_FRONTEND_API_BASE_URL: ${CAPATAZ_FRONTEND_API_BASE_URL:-/api/v1}
      CAPATAZ_FRONTEND_USE_MSW: ${CAPATAZ_FRONTEND_USE_MSW:-false}
      CAPATAZ_FRONTEND_DEV_USER: ${CAPATAZ_FRONTEND_DEV_USER:-ana.admin}
      CAPATAZ_FRONTEND_OIDC_ISSUER: ${CAPATAZ_FRONTEND_OIDC_ISSUER:-}
      CAPATAZ_FRONTEND_OIDC_CLIENT_ID: ${CAPATAZ_FRONTEND_OIDC_CLIENT_ID:-}
      CAPATAZ_FRONTEND_OIDC_SCOPE: ${CAPATAZ_FRONTEND_OIDC_SCOPE:-openid profile email groups}
    ports:
      - "${CAPATAZ_FRONTEND_PORT:-8090}:80"
    networks:
      - edge
    depends_on:
      api:
        condition: service_healthy
    # frontend/Dockerfile ya construye la imagen como usuario no root (101) y
    # aplica setcap cap_net_bind_service al binario de nginx. Solo hace falta
    # conceder esa misma capability al contenedor para que el bind a :80 real
    # funcione bajo cap_drop: ALL; no se necesita ejecutar como root.
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /var/cache/nginx:rw,noexec,nosuid,size=32m
      - /var/run:rw,noexec,nosuid,size=8m
      # Only writable path under the app's own tree — everything else served by Nginx (the
      # built static bundle) stays on the read-only root filesystem. See default.conf's
      # `location = /config.js` alias and docs/adr/007-runtime-frontend-config.en.md.
      - /config-runtime:rw,noexec,nosuid,size=1m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: capataz-api:local
    environment: *api-env
    ports:
      - "8000:8000"
    networks:
      - edge
      - internal
    volumes:
      - ./catalog:/app/catalog:ro
      - ./api/alembic.ini:/app/alembic.ini:ro
      - ./api/alembic:/app/alembic:ro
      - ./certs:/run/ca-certs:ro
    secrets:
      - database_url
      - redis_url
      - portainer_token
      - cognito_client_secret
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - /bin/sh
      - -ec
      - >-
        alembic upgrade head &&
        exec uvicorn capataz_api.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 768M

  runner:
    build:
      context: ./runner
      dockerfile: Dockerfile
    image: capataz-runner:local
    environment: *api-env
    networks:
      - internal
    volumes:
      - ./certs:/run/ca-certs:ro
    secrets:
      - database_url
      - redis_url
      - portainer_token
      - runner_ssh_private_key
      - runner_known_hosts
      - ansible_vault_password
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
      - /home/capataz/.ansible/tmp:rw,noexec,nosuid,size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "celery -A capataz_runner.celery_app:app inspect ping --timeout=5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${CAPATAZ_POSTGRES_DB:-capataz}
      POSTGRES_USER: ${CAPATAZ_POSTGRES_USER:-capataz}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    networks:
      - internal
    volumes:
      - postgres_data:/var/lib/postgresql/data
    secrets:
      - postgres_password
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The official postgres entrypoint runs as root on first start to chown/chmod a
    # fresh PGDATA volume, then drops to the postgres user via gosu — that needs
    # CHOWN/DAC_OVERRIDE/FOWNER (for the chown/chmod) and SETUID/SETGID (for gosu
    # itself). Without them the entrypoint loops on "Operation not permitted".
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M

  redis:
    image: redis:7-alpine
    command:
      - /bin/sh
      - -ec
      - exec redis-server --appendonly yes --requirepass "$$(cat /run/secrets/redis_password)"
    networks:
      - internal
    volumes:
      - redis_data:/data
    secrets:
      - redis_password
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Our custom `command:` bypasses docker-entrypoint.sh's `[ "$1" = 'redis-server' ]` check
    # (it doesn't see "redis-server" as $1), so the image's usual chown-then-drop-to-redis-user
    # dance never runs and the process stays root without matching ownership of the redis_data
    # volume — same root cause as postgres above, same minimal capability set needed.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/redis_password)\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

networks:
  edge:
    name: capataz_edge
    driver: bridge
  internal:
    name: capataz_internal
    driver: bridge

volumes:
  postgres_data:
  redis_data:

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  redis_password:
    file: ./secrets/redis_password
  database_url:
    file: ./secrets/database_url
  redis_url:
    file: ./secrets/redis_url
  portainer_token:
    file: ./secrets/portainer_token
  cognito_client_secret:
    file: ./secrets/cognito_client_secret
  runner_ssh_private_key:
    file: ./secrets/runner_ssh_private_key
  runner_known_hosts:
    file: ./secrets/runner_known_hosts
  ansible_vault_password:
    file: ./secrets/ansible_vault_password
