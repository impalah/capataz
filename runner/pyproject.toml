[project]
name = "capataz-runner"
version = "0.1.1"
description = "Secure persistent Celery automation runner for Capataz"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "ansible-core>=2.17,<2.22",
  "ansible-runner>=2.4,<2.5",
  "asyncpg>=0.30",
  "celery[redis]>=5.4",
  "httpx>=0.28",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "sqlalchemy>=2.0",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.20",
  "mypy>=1.13",
  "pysonar>=1.7.0",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6.0",
  "ruff>=0.8",
]

[project.scripts]
capataz-runner = "capataz_runner.celery_app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=capataz_runner --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["capataz_runner"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["capataz_runner"]

[tool.mypy]
python_version = "3.14"
files = ["src/capataz_runner"]
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["celery", "celery.*", "ansible_runner", "ansible_runner.*"]
ignore_missing_imports = true
