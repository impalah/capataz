[alembic]
script_location = alembic
prepend_sys_path = src
# Silences alembic's DeprecationWarning about falling back to legacy space/comma/colon splitting
# for path_separator; os.pathsep is the only separator prepend_sys_path actually needs here.
path_separator = os
sqlalchemy.url = postgresql+psycopg://capataz@postgres:5432/capataz

[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
