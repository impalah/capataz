# Config de análisis para sonar-scanner (ver Makefile: make sonar / sonar-check).
# SONAR_HOST_URL y SONAR_TOKEN van por variables de entorno (.env), nunca aquí.
sonar.projectKey=capataz-frontend
sonar.projectName=capataz-frontend
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Evita que el escáner analice artefactos generados como si fueran código fuente.
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/playwright-report/**,**/test-results/**,**/src/api/openapi.generated.ts

# Mismo alcance que coverage.exclude en vite.config.ts: código sin lógica propia que probar
# (tipos y los puntos de entrada finos main.ts/App.vue), para que el % de cobertura de SonarQube
# coincida con el alcance intencional de Vitest, no con huecos.
sonar.coverage.exclusions=src/api/openapi.generated.ts,src/api/types.ts,src/main.ts,src/App.vue

# Los 8 locales (src/i18n/locales/*.ts) tienen que declarar exactamente la misma estructura de
# claves anidadas — MessageSchema (src/i18n/schema.ts) deriva ese tipo de es-ES.ts vía Widen<> y
# vue-tsc rechaza cualquier locale al que le falte o le sobre una clave, así que la duplicación
# estructural entre ellos (mismas claves, distinto texto traducido) es intencionada, no código
# copy-pasted por descuido. Se excluyen solo de la detección de duplicados (no de
# sonar.exclusions): siguen analizándose por bugs/code smells reales, como cualquier otro fichero.
sonar.cpd.exclusions=src/i18n/locales/**
