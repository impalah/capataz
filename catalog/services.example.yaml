version: 1
services:
  - id: open-webui
    name: Open WebUI
    description: Interfaz de modelos locales y externos y me voy a pasar de líneas a ver qué hace.
    group_name: IA
    environment: homelab
    icon: auto_awesome
    service_url: https://openwebui.404labo.net
    documentation_url: https://docs.openwebui.com
    portainer:
      environment_id: 7
      stack_name: open-webui
      aggregation: all_required
      services:
        - name: open-webui
          replicas: 1
          required: true
    health:
      type: http
      url: https://openwebui.404labo.net/health
      expected_status: 200
      timeout_seconds: 5
    grafana:
      dashboard_uid: homelab-servicio-generico/servicio-generico
      variables:
        var-service: open-webui
        kiosk: "true"
    metrics:
      - label: CPU
        type: prometheus
        query: 'avg(rate(container_cpu_usage_seconds_total{container_label_com_docker_stack_namespace="open-webui"}[30s]) or rate(container_cpu_usage_seconds_total{container_label_com_docker_compose_service="open-webui"}[30s])) * 100'
      - label: Memoria
        type: prometheus
        query: 'avg(container_memory_working_set_bytes{container_label_com_docker_stack_namespace="open-webui"} or container_memory_working_set_bytes{container_label_com_docker_compose_service="open-webui"}) / 1024 / 1024'
    actions:
      - key: restart
        label: Reiniciar
        icon: restart_alt
        action_type: portainer
        risk_level: operate
        requires_confirmation: true
        unattended: true
        config:
          operation: restart
          target: selected_services
      - key: backup
        label: Copia de seguridad
        icon: backup
        action_type: ansible
        risk_level: critical
        requires_confirmation: true
        config:
          playbook: playbooks/backup_service.yml
          inventory: inventories/homelab.yml
          limit: node-ai-01
          extra_vars:
            service: open-webui
          timeout_seconds: 600

