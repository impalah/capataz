<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Capataz — búho geométrico</title>
  <desc id="desc">Icono monocromo de una cabeza de búho frontal, con penachos cortos, grandes discos oculares y pico central.</desc>

  <!-- Monocromo. Cambia el color desde CSS con `color`. -->
  <g fill="currentColor">
    <!-- Silueta: penachos, cabeza ancha y base redondeada -->
    <path d="M10 19 L19 14 L23 19 C26 17 29 16 32 16 C35 16 38 17 41 19 L45 14 L54 19 L52 42 C51 51 43 56 32 56 C21 56 13 51 12 42 Z" />

    <!-- Dos discos oculares, claramente de búho -->
    <circle cx="23" cy="35" r="10" fill="white" />
    <circle cx="41" cy="35" r="10" fill="white" />

    <!-- Pupilas: indicadores de estado -->
    <circle cx="23" cy="35" r="4" />
    <circle cx="41" cy="35" r="4" />

    <!-- Pico geométrico en negativo -->
    <path d="M32 39 L36 44 L32 48 L28 44 Z" fill="white" />
  </g>
</svg>
