version: 1
services:
  - id: open-webui
    name: Open WebUI
    description: Interfaz de modelos locales y externos y me voy a pasar de líneas a ver qué hace.
    group_name: IA
    environment: homelab
    icon: auto_awesome
    service_url: https://openwebui.home.arpa
    documentation_url: https://docs.openwebui.com
    portainer:
      environment_id: 6
      stack_name: homelab-retaco
      aggregation: all_required
      containers:
        - name: open-webui
          required: true
    health:
      type: http
      url: https://openwebui.home.arpa/health
      expected_status: 200
      timeout_seconds: 5
    grafana:
      dashboard_uid: containers-overview
      variables:
        service: open-webui
    actions:
      - key: restart
        label: Reiniciar
        icon: restart_alt
        action_type: portainer
        risk_level: operate
        requires_confirmation: true
        unattended: true
        config:
          operation: restart
          target: selected_containers
      - key: backup
        label: Copia de seguridad
        icon: backup
        action_type: ansible
        risk_level: critical
        requires_confirmation: true
        config:
          playbook: playbooks/backup_service.yml
          inventory: inventories/homelab.yml
          limit: node-ai-01
          extra_vars:
            service: open-webui
          timeout_seconds: 600

