[project]
name = "capataz-api"
version = "0.1.0"
description = "Capataz homelab control-plane API"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "alembic>=1.14",
  "asyncpg>=0.30",
  "auth-middleware>=0.6.1",
  "celery[redis]>=5.4",
  "fastapi>=0.115",
  "httpx>=0.28",
  "loguru>=0.7",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "psycopg[binary]>=3.2",
  "PyYAML>=6.0",
  "redis>=5.2",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.20",
  "coverage>=7.6",
  "import-linter>=2.13",
  "mypy>=1.13",
  "pysonar>=1.7.0",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "testcontainers[postgres]>=4.9",
]

[project.scripts]
capataz-api = "capataz_api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=capataz_api --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["capataz_api"]
# Every layer (HTTP routers, bootstrap wiring, core settings, infra adapters) now has real
# unit-test coverage via mocking/in-memory doubles/FastAPI TestClient (see tests/unit/) — no
# directory is exempted from measurement, so this number matches what SonarQube reports too.

[tool.ruff]
line-length = 100
target-version = "py314"
# Auto-generated Alembic migrations aren't hand-maintained code; mypy already
# excludes them below. Consistent with never editing an applied migration.
exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008", "ASYNC240"]

[tool.ruff.lint.isort]
known-first-party = ["capataz_api"]

[tool.mypy]
python_version = "3.14"
files = ["src/capataz_api"]
strict = true
warn_unused_ignores = true
exclude = ["alembic"]
plugins = ["pydantic.mypy"]
# FastAPI, Celery and SQLAlchemy boundaries return dynamic values. Domain and
# application modules remain strict; these framework-bound errors are tracked
# by integration tests instead of unsafe blanket casts.
disable_error_code = [
  "arg-type",
  "assignment",
  "attr-defined",
  "comparison-overlap",
  "no-any-return",
  "no-untyped-def",
  "override",
  "unused-ignore",
]

[[tool.mypy.overrides]]
module = ["yaml", "celery", "testcontainers.*", "auth_middleware.*"]
ignore_missing_imports = true

[tool.importlinter]
root_package = "capataz_api"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain has no framework or outer-layer dependencies"
type = "forbidden"
source_modules = ["capataz_api.domain"]
forbidden_modules = [
  "capataz_api.application",
  "capataz_api.adapters",
  "capataz_api.infrastructure",
  "capataz_api.bootstrap",
  "fastapi",
  "sqlalchemy",
  "celery",
  "httpx",
]

[[tool.importlinter.contracts]]
name = "Application has no adapter/infrastructure/bootstrap or web/db/queue framework dependencies"
type = "forbidden"
source_modules = ["capataz_api.application"]
forbidden_modules = [
  "capataz_api.adapters",
  "capataz_api.infrastructure",
  "capataz_api.bootstrap",
  "fastapi",
  "sqlalchemy",
  "celery",
  "httpx",
]

# deps.py is the sanctioned DI-wiring exception (constructs the concrete SqlAlchemyRepository) and
# is deliberately excluded from source_modules below — every other router must depend only on the
# application-layer services/ports it is given via Depends(...), never on infrastructure directly.
[[tool.importlinter.contracts]]
name = "Inbound routers do not import infrastructure directly"
type = "forbidden"
source_modules = [
  "capataz_api.adapters.inbound.routers.services",
  "capataz_api.adapters.inbound.routers.actions",
  "capataz_api.adapters.inbound.routers.executions",
  "capataz_api.adapters.inbound.routers.catalog",
  "capataz_api.adapters.inbound.routers.audit",
  "capataz_api.adapters.inbound.routers.health",
  "capataz_api.adapters.inbound.routers.auth",
]
forbidden_modules = ["capataz_api.infrastructure"]
# Routers legitimately import deps.py for `Depends(...)` providers, and deps.py itself is the one
# sanctioned place that wires the concrete SqlAlchemyRepository — only that single edge is exempt.
ignore_imports = [
  "capataz_api.adapters.inbound.routers.deps -> capataz_api.infrastructure.database.repositories",
]
