  docker:
    name: Docker build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        component: [api, runner, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Construir imagen
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          file: ./${{ matrix.component }}/Dockerfile
          push: false
          tags: capataz-${{ matrix.component }}:ci

  compose-config:
    name: Validar configuración Compose
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Crear ficheros de secretos de validación
        run: |
          mkdir -p secrets
          for secret in postgres_password redis_password database_url redis_url portainer_token cognito_client_secret runner_ssh_private_key runner_known_hosts ansible_vault_password; do
            printf 'validation-only' > "secrets/$secret"
          done
      - run: docker compose config --quiet
